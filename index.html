<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zarvellaa Lifestyle | Connect With Us</title>
<meta name="description" content="Visit Zarvellaa Lifestyle and connect on WhatsApp, Instagram and Facebook.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a0d; --plum:#2a1230; --wine:#4a1d3d;
  --gold:#d9b46c; --gold-soft:#f1dba6; --ivory:#f6efe4; --muted:#b9aebd;
  --glass:rgba(255,255,255,.06); --line:rgba(217,180,108,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Jost',system-ui,sans-serif; color:var(--ivory); background:var(--bg);
  display:flex; justify-content:center; padding:48px 20px calc(40px + env(safe-area-inset-bottom));
  background:
    radial-gradient(700px 500px at 15% -5%, var(--wine) 0%, transparent 60%),
    radial-gradient(600px 500px at 100% 100%, var(--plum) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed; overflow-x:hidden;
}
.wrap{width:100%; max-width:440px; text-align:center}

/* Brand */
.logo{
  width:100%; max-width:340px; margin:0 auto 6px; border-radius:24px; padding:3px;
  background:conic-gradient(from 200deg,#f1dba6,#b8894a,#fff3cf,#9c6f33,#f1dba6);
  box-shadow:0 0 0 8px rgba(217,180,108,.08), 0 24px 56px rgba(0,0,0,.6), 0 0 70px rgba(217,180,108,.2);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
.logo img{display:block;width:100%;height:auto;border-radius:21px;aspect-ratio:900/651;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rule{display:flex;align-items:center;gap:12px;margin:28px auto 22px;width:70%}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rule i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}
.tag{font-size:15px;color:var(--ivory);opacity:.82;line-height:1.6;margin:-6px auto 30px;max-width:320px;font-weight:300}

/* Links */
.links{display:flex;flex-direction:column;gap:14px}
.link{
  position:relative; display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--ivory);
  padding:14px 18px 14px 14px; border-radius:18px; text-align:left;
  background:var(--glass); border:1px solid var(--line);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden; transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s;
}
.link::after{
  content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,243,207,.22),transparent);
  transform:skewX(-20deg); transition:left .7s ease;
}
.link:hover,.link:focus-visible{transform:translateY(-3px); border-color:var(--gold); box-shadow:0 18px 40px rgba(0,0,0,.5), 0 0 28px rgba(217,180,108,.18)}
.link:hover::after{left:130%}
.link:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.link:active{transform:translateY(0) scale(.99)}
.ic{
  flex:none; width:52px; height:52px; border-radius:14px; display:grid; place-items:center; position:relative; overflow:hidden;
  background:#171119; border:1px solid rgba(217,180,108,.35);
}
.ic svg{width:26px;height:26px;fill:var(--gold-soft)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#171119}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.txt small{display:block;font-size:13px;color:var(--muted);margin-top:3px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:background .3s,border-color .3s}
.go svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.link:hover .go{background:var(--gold);border-color:var(--gold)}
.link:hover .go svg{stroke:#1a1020}

/* Featured website button */
.link.main{
  background:linear-gradient(135deg,#f1dba6 0%,#d9b46c 45%,#a97d3d 100%); color:#1a1020; border-color:transparent;
  box-shadow:0 16px 40px rgba(169,125,61,.35), inset 0 1px 0 rgba(255,255,255,.5);
}
.link.main .txt small{color:rgba(26,16,32,.7)}
.link.main .ic{background:rgba(26,16,32,.9);border-color:transparent}
.link.main .go{border-color:rgba(26,16,32,.35)}
.link.main .go svg{stroke:#1a1020}
.link.main:hover .go{background:#1a1020;border-color:#1a1020}
.link.main:hover .go svg{stroke:var(--gold-soft)}

footer{margin-top:36px;font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:300}
footer span{color:var(--gold)}

/* One entrance sequence */
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.links .link:nth-child(1){animation-delay:.4s}.links .link:nth-child(2){animation-delay:.48s}
.links .link:nth-child(3){animation-delay:.56s}.links .link:nth-child(4){animation-delay:.64s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">

  <div class="logo"><img src="Zarvellaa-logo.png" alt="Zarvellaa Lifestyle logo" width="900" height="651"></div>
  <h1 class="sr">Zarvellaa Lifestyle</h1>
  <div class="rule rise"><i></i></div>

  <nav class="links" aria-label="Zarvellaa Lifestyle links">

    <a class="link main rise" href="https://zarvellaalifestyle.github.io/" target="_blank" rel="noopener">

        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3a15.6 15.6 0 0 0-1.2-5A8 8 0 0 1 18.9 11ZM12 4c.8 1 1.7 3.1 2 7H10c.3-3.900 1.200-6 2-7ZM9.300 6a15.600 15.600 0 0 0-1.200 5h-3A8 8 0 0 1 9.300 6ZM5.100 13h3c.1 1.800.5 3.500 1.200 5A8 8 0 0 1 5.100 13ZM12 20c-.8-1-1.700-3.100-2-7h4c-.3 3.900-1.200 6-2 7Zm2.700-2c.7-1.500 1.100-3.200 1.200-5h3a8 8 0 0 1-4.200 5Z"/></svg>

    <a class="link rise" href="https://wa.me/916289277681" target="_blank" rel="noopener">
      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Zm5.800 14.100c-.2.700-1.400 1.300-1.900 1.400-.5.100-1.100.1-1.800-.1-.4-.1-.9-.3-1.600-.6-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800 0-1.300.7-2 .9-2.300.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500.2.500.8 1.900.9 2 .1.100.1.300 0 .5-.1.200-.2.300-.3.500l-.4.500c-.1.100-.3.300-.1.600.2.300.7 1.100 1.500 1.800 1 .9 1.900 1.200 2.200 1.300.3.100.5.100.6-.1.200-.2.700-.8.900-1.100.2-.3.400-.2.600-.1l1.800.9c.3.100.5.200.5.300.1.200.1.800-.1 1.500Z"/></svg>
        <img src="Whatsapp%20Logo.png" alt="" onerror="this.remove()">
      </span>
      <span class="txt"><b>WhatsApp</b><small>Chat with us directly</small></span>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="link rise" href="https://www.instagram.com/zarvellaa_lifestyle/" target="_blank" rel="noopener">
      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M7.800 2h8.400A5.800 5.800 0 0 1 22 7.800v8.400a5.800 5.800 0 0 1-5.800 5.800H7.800A5.800 5.800 0 0 1 2 16.200V7.800A5.800 5.800 0 0 1 7.800 2Zm-.2 2A3.600 3.600 0 0 0 4 7.600v8.800A3.600 3.600 0 0 0 7.600 20h8.800a3.600 3.600 0 0 0 3.600-3.600V7.600A3.600 3.600 0 0 0 16.400 4H7.600Zm9.700 1.500a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
        <img src="instgram%20logo.png" alt="" onerror="this.remove()">
      </span>
      <span class="txt"><b>Instagram</b><small>@zarvellaa_lifestyle</small></span>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="link rise" href="https://www.facebook.com/share/1bVpSZLPiS/" target="_blank" rel="noopener">
      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M13.500 22v-8.200h2.800l.4-3.300h-3.200V8.400c0-.9.300-1.600 1.600-1.600h1.700V3.900c-.3 0-1.300-.1-2.500-.1-2.500 0-4.200 1.500-4.200 4.300v2.400H7.300v3.300h2.800V22h3.400Z"/></svg>
        <img src="Facebook%20Logo.png" alt="" onerror="this.remove()">
      </span>
      <span class="txt"><b>Facebook</b><small>Follow our page</small></span>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

  </nav>

  <footer>&copy; <span>Zarvellaa Lifestyle</span></footer>
</main>
</body>
</html>
